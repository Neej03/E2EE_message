version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cipherpulse_postgres
    environment:
      POSTGRES_USER: cipheruser
      POSTGRES_PASSWORD: cipherpassword
      POSTGRES_DB: cipherpulse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipheruser -d cipherpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cipherpulse_redis
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cipherpulse_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://cipheruser:cipherpassword@postgres:5432/cipherpulse_db?schema=public
      JWT_SECRET: cipherpulse-super-secret-e2ee-jwt-key-2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cipherpulse_frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
